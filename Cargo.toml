[package]
name = "image-viewer"
version = "0.2.1"
edition = "2021"

[dependencies]
eframe = { version = "0.32", features = ["default_fonts"] }
egui = "0.32"
image = "0.25"
rfd = "0.15"
fast_image_resize = { version = "6", features = ["image", "only_u8x4"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 2
strip = true
lto = false
panic = "unwind"

[dev-dependencies]
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

