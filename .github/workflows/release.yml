name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: build and test exactly as a release would, then keep the exe as a
  # workflow artifact instead of publishing a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Build release exe
        run: cargo build --release --locked

      - name: Stage asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          # Branch names such as codex/foo contain "/", which is not valid in a file name.
          $name = "${{ github.ref_name }}" -replace '[\\/:*?"<>|]', '-'
          Copy-Item target/release/image-viewer.exe "dist/image-viewer-$name-windows-x86_64.exe"

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: image-viewer-dry-run
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
