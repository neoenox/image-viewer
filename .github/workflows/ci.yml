name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Shared performance gate (moved out of the feature PR so every PR inherits it):
  # regression benches plus a differential release-binary size check.
  perf:
    runs-on: windows-latest
    steps:
      # Two checkouts so the size gate is a same-runner, same-toolchain
      # differential (head vs the PR base): immune to rustc/linker drift that
      # would false-fail an absolute byte baseline.
      - uses: actions/checkout@v5
        with:
          path: head
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            head -> target
            base -> target-base
      - name: Regression benches (release, gated)
        working-directory: head
        run: |
          cargo test --locked --release --lib -- --ignored --nocapture bench::
      - name: Build head release (size gate)
        working-directory: head
        run: cargo build --locked --release
      - name: Build base release (size gate)
        working-directory: base
        run: cargo build --locked --release --target-dir target-base
      - name: Binary size regression gate (+5%)
        shell: pwsh
        run: |
          $base = (Get-Item 'base/target-base/release/image-viewer.exe').Length
          $head = (Get-Item 'head/target/release/image-viewer.exe').Length
          $limit = [math]::Floor($base * 1.05)
          $pct = ($head - $base) / $base * 100
          Write-Host ("release exe  base={0} B  head={1} B  delta={2:N2}%  limit={3} B (+5%)" -f $base, $head, $pct, $limit)
          if ($head -gt $limit) {
            Write-Error ("release exe grew {0:N2}% ({1} -> {2} B), over the +5% gate" -f $pct, $base, $head)
            exit 1
          }
          Write-Host 'binary size gate: OK'

  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Guard against production registry writes
        run: powershell -NoProfile -File tests/guard-registry-keys.ps1
      - name: Test association scripts without changing user defaults
        run: powershell -NoProfile -File tests/association-scripts.ps1

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build environment preflight
        run: pwsh -NoProfile -File scripts/preflight.ps1
        shell: pwsh

  # Line coverage is measured on Windows, the primary platform: `assoc.rs`,
  # `win_icon.rs` and the Windows half of `window_state.rs` only compile there,
  # so a Linux run would not see them. The reverse is the honest cost: code
  # behind `#[cfg(not(windows))]` is not compiled here and is not measured (the
  # non-Windows association mirror is still covered, via
  # tests/assoc-mirror-parity.rs, which includes it on every platform).
  # A separate job so a coverage regression is named clearly instead of hiding
  # in the test job's output.
  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Floor, not a target: the measured total is 87.3% of lines (6123 lines,
      # 778 uncovered) on Windows, so 85 leaves about two points of slack for
      # runner variation while still failing any change that adds a few hundred
      # uncovered lines. Raise it as coverage improves; do not lower it to make
      # a red run green. `--summary-only` prints the per-file table into the log.
      - name: Measure line coverage and enforce the floor
        run: cargo llvm-cov --locked --all-targets --summary-only --fail-under-lines 85
      - name: Write the report for the artifact
        if: always()
        run: |
          # `report --output-path` does not create parent directories (verified:
          # it fails with "path not found"), so make them first.
          New-Item -ItemType Directory -Force -Path target/coverage | Out-Null
          cargo llvm-cov report --locked --lcov --output-path target/coverage/lcov.info
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: target/coverage/lcov.info
