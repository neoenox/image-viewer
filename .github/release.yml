# Groups the auto-generated release notes by PR label. Uses the repository's
# existing labels; unlabelled PRs are listed under "その他".
changelog:
  categories:
    - title: 新機能・改善
      labels:
        - enhancement
    - title: 不具合の修正
      labels:
        - bug
    - title: ドキュメント
      labels:
        - documentation
    - title: その他
      labels:
        - "*"
